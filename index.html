<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <title>Baby Shop</title>
</head>
<body>
   <header>
    <nav class="navbar">
        <div class="nav-left">
            <a href="#">Home</a>
            <a href="#">About Us</a>
            <a href="#">Shop</a>
            <a href="#">Contact</a>
        </div>

        <div class="logo">
            <img src="assets/logo.png" alt="logo">
        </div>

        <div class="nav-right">
            <a href="#">Log In</a>
            <a href="#">Register</a>

            <button class="cart-btn">
                <i class="fa-solid fa-cart-shopping"></i>

            </button>
        </div>
    </nav>

<section class="hero">
    <div class="hero-left"></div>

<section class="promo-section">

        <img src="assets/Frame 209.png" class="frame-img" alt="">

    <div class="promo-right">
        <img src="assets/baby-2.avif" class="baby2-img" alt="">
        <img src="assets/baby-1.png" class="baby1-img" alt="">
    </div>
</section>

<section class="banner-section">
    <div class="banner">
        <img src="assets/YOUR DREAM BABY SHOP.png" class="banner-center" alt="">
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
