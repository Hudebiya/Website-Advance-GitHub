<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"><link rel="stylesheet" href="style.css">
    <title>Baby Shop</title>
</head>
<body>
   <<header>
        <nav class="navbar navbar-expand-lg py-2">
            <div class="container-fluid px-4 px-lg-5">
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse w-100" id="mainNavbar">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">About Us</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Shop</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                    </ul>

                    <a class="navbar-brand mx-auto d-none d-lg-block" href="#">
                        <img src="assets/logo.png" alt="Baby Shop Logo" class="logo-img">
                    </a>

                    <div class="d-flex align-items-center gap-3 ms-auto">
                        <a href="#" class="auth-link me-2">Log In</a>
                        <a href="#" class="auth-link me-3">Register</a>
                        <a href="#" class="btn-cart">
                            <i class="fa-solid fa-cart-shopping me-2"></i>Cart
                        </a>
                    </div>
                </div>
                <a class="navbar-brand d-lg-none" href="#">
                    <img src="assets/logo.png" alt="Baby Shop Logo" class="logo-img" style="max-width: 140px;">
                </a>
            </div>
        </nav>
    </header>

    <section class="hero-section container-fluid p-0">
    <div class="hero-wrapper">
        
        <img src="assets/hero-1.avif" alt="Baby Shop Banner" class="hero-bg-img">

        <div class="hero-content-overlay">
            <h1 class="hero-heading">
                YOUR DREAM <br>
                <span class="highlight">BABY SHOP</span>
            </h1>
            <a href="#" class="btn-shop-now">SHOP NOW</a>
        </div>
    </div>
</section>

<section class="journey-section py-5">
    <div class="container">
        <div class="journey-card">
            <div class="row align-items-center">
                
                <div class="col-lg-6 col-md-12 text-center">
                    <div class="journey-img-box">
                        <img src="assets/Frame 209.png" alt="Begin Your Baby's Journey" class="img-fluid">
                    </div>
                </div>
                <div class="col-lg-6 col-md-12 text-center">
                    <div class="journey-img-box">
                        <img src="assets/baby-2.avif" alt="Begin Your Baby's Journey" class="img-fluid">
                    </div>
                </div>

            </div>
        </div>
    </div>
</section>

<section class="dual-promo-section">
    <div class="container">
        <div class="row g-4">
            
            <div class="col-md-6">
                <div class="promo-banner-card">
                    <img src="assets/chair.avif" alt="Promo Left" class="img-fluid promo-img">
                </div>
            </div>
            <div class="col-md-6">
                <div class="promo-banner-card">
                    <img src="assets/baby-1.png" alt="Promo Right" class="img-fluid promo-img">
                </div>
            </div>

        </div>
    </div>
</section>

<section class="edge-banner-section">
    <div class="container-fluid px-0">
        <div class="edge-banner-card">
            <img src="assets/img-1.avif" alt="Special Offer Banner" class="img-fluid edge-banner-img">
        </div>
    </div>
</section>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
